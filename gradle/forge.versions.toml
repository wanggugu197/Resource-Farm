[versions]
configuration = "4.1.2+26.1.2"

registryLib = "8.0.15"
mapleutillib = "0.2.6"
ldlib2 = "26.1.2.29"

jei = "29.16.0.48"
jade = "26.1.8+neoforge"

cucumber = "26.1.2-9.0.5"
mysticalagriculture = "26.1.2-9.0.4"
mysticalagradditions = "26.1.2-9.0.1"
mysticalautomation = "26.1.2-2.0.6"

[libraries]
configuration       = { module = "dev.toma.configuration:configuration-neoforge", version.ref = "configuration" }

# https://maven.gtodyssey.com/#/releases/com/gto/registrylib-neoforge-26.1.2
registrylib = { group = "com.gto", name = "registrylib-neoforge-26.1.2", version.ref = "registryLib" }
# https://maven.gtodyssey.com/#/releases/com/maple197/MapleUtilLib-neoforge-26.1.2
mapleutillib = { group = "com.maple197", name = "MapleUtilLib-neoforge-26.1.2", version.ref = "mapleutillib" }

# https://maven.firstdark.dev/#/snapshots/com/lowdragmc/ldlib2/ldlib2-neoforge-26.1
ldlib2 = { group = "com.lowdragmc.ldlib2", name = "ldlib2-neoforge-26.1", version.ref = "ldlib2" }

jei-neoforge-api    = { module = "mezz.jei:jei-26.1.2-neoforge-api", version.ref = "jei" }
jei-neoforge-impl   = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }

jade                = { module = "maven.modrinth:jade", version.ref = "jade" }

# https://maven.blakesmods.com/#/releases/com/blakebr0/cucumber/Cucumber
cucumber = { group = "com.blakebr0.cucumber", name = "Cucumber", version.ref = "cucumber" }
# https://maven.blakesmods.com/#/releases/com/blakebr0/mysticalagriculture/MysticalAgriculture
mysticalagriculture = { group = "com.blakebr0.mysticalagriculture", name = "MysticalAgriculture", version.ref = "mysticalagriculture" }
# https://maven.blakesmods.com/#/releases/com/blakebr0/mysticalagradditions/MysticalAgradditions
mysticalagradditions = { group = "com.blakebr0.mysticalagradditions", name = "MysticalAgradditions", version.ref = "mysticalagradditions" }
# https://maven.blakesmods.com/#/releases/com/blakebr0/mysticalautomation/MysticalAutomation
mysticalautomation = { group = "com.blakebr0.mysticalautomation", name = "MysticalAutomation", version.ref = "mysticalautomation" }


[bundles]
jei = ["jei-neoforge-api", "jei-neoforge-impl"]

extraMystical = ["cucumber", "mysticalagriculture", "mysticalagradditions", "mysticalautomation"]
